<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ira Shopping</title>
<meta name="description" content="Tudo de Iracemápolis num lugar só: comércios e serviços da cidade, com contato direto por WhatsApp.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de bairro em coluna única no celular (busca, 5 categorias, filtros rápidos, banner, destaques em 2 colunas) e barra de abas embaixo; no desktop as abas sobem para o topo. */
:root{
  --bg:#f8f4ec; --surface:#fffdf8; --ink:#0c1b3a; --muted:#66708a; --line:#e6dcc6;
  --brand:#12285a; --brand-ink:#ffffff; --orange:#b8893a; --orange-ink:#ffffff; --gold:#c9a24d; --gold2:#f0d99a; --navy:#0a1736;
  --wa:#128c4a; --wa-ink:#ffffff; --ok:#12803f; --bad:#b4432b; --tint:#efe7d4;
  --c1:#f3ead7; --c2:#f3ead7; --c3:#f3ead7; --c4:#f3ead7; --c5:#f3ead7; --star:#c9a24d;
  --shadow:0 1px 2px rgba(12,27,58,.06),0 10px 28px rgba(12,27,58,.10);
  --display:"Cormorant Garamond","Playfair Display",Georgia,serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070f22; --surface:#0f1b3a; --ink:#f3ecd9; --muted:#a3adc8; --line:#24335f;
  --brand:#d9b66a; --brand-ink:#0a1530; --orange:#d9b66a; --orange-ink:#1b1405; --gold:#d9b66a; --gold2:#f0d99a; --navy:#050b1b;
  --wa:#2bb673; --wa-ink:#04251c; --ok:#5fd68c; --bad:#f09a82; --tint:#17264d;
  --c1:#16244a; --c2:#16244a; --c3:#16244a; --c4:#16244a; --c5:#16244a; --star:#d9b66a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070f22; --surface:#0f1b3a; --ink:#f3ecd9; --muted:#a3adc8; --line:#24335f;
  --brand:#d9b66a; --brand-ink:#0a1530; --orange:#d9b66a; --orange-ink:#1b1405; --gold:#d9b66a; --gold2:#f0d99a; --navy:#050b1b;
  --wa:#2bb673; --wa-ink:#04251c; --ok:#5fd68c; --bad:#f09a82; --tint:#17264d;
  --c1:#16244a; --c2:#16244a; --c3:#16244a; --c4:#16244a; --c5:#16244a; --star:#d9b66a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
h1,h2,h3{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* topo */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 8px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo svg{flex:none;width:44px;height:44px}
.wm{white-space:nowrap;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1}
.wm b{color:var(--brand)} .wm i{color:var(--orange);font-style:normal}
.tag{font-size:11px;color:var(--muted);margin-top:3px}
.loc{position:relative}
.loc>button{display:flex;align-items:center;gap:4px;border:0;background:none;font-weight:700;color:var(--brand);font-size:13px;padding:8px 0;white-space:nowrap}
.pop{position:absolute;right:0;top:100%;z-index:20;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;width:230px;font-size:14px}
.pop small{display:block;color:var(--muted);margin-top:4px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:4px 6px 4px 16px;box-shadow:var(--shadow)}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:17px;padding:13px 0;outline:0}
.search input::placeholder{color:var(--muted)}
.fbtn{width:44px;height:44px;border-radius:12px;border:0;background:none;color:var(--brand);border-left:1.5px solid var(--line);border-radius:0 12px 12px 0}
.tabs{display:none}
/* categorias */
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:18px}
.cat{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:14px}
.cat .tile{width:100%;aspect-ratio:1;border-radius:20px;display:grid;place-items:center;border:2px solid transparent;transition:transform .15s}
.cat .tile svg{width:46%;height:46%}
.cat:nth-child(1) .tile{background:var(--c1);color:#d9531a}.cat:nth-child(2) .tile{background:var(--c2);color:#1f8a47}
.cat:nth-child(3) .tile{background:var(--c3);color:#1b6fc4}.cat:nth-child(4) .tile{background:var(--c4);color:#5b46c9}
.cat:nth-child(5) .tile{background:var(--c5);color:#a47200}
.cat[aria-pressed="true"] .tile{border-color:var(--brand);transform:translateY(-2px)}
.cat[aria-pressed="true"]{color:var(--brand)}
.subs,.chips{display:flex;gap:6px;overflow-x:auto;padding-block:2px;scrollbar-width:none;flex-wrap:nowrap;margin-top:14px}
.subs::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);padding:9px 12px;border-radius:99px;font-size:13.5px;font-weight:600}
.chip svg{width:18px;height:18px;color:var(--brand)}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.chip[aria-pressed="true"] svg{color:var(--brand-ink)}
@media (min-width:700px){.chips{flex-wrap:wrap}.subs{flex-wrap:wrap}}
@media (min-width:700px){.cats{max-width:640px;gap:14px}.banner{min-height:190px}.banner svg{width:auto;max-width:none;aspect-ratio:2/1}.banner div{max-width:55%}}
/* banner */
.banner{margin-top:18px;border-radius:20px;overflow:hidden;position:relative;background:linear-gradient(120deg,#0a1736,#16306b);color:#fff;display:flex;min-height:150px}
.banner div{padding:20px;position:relative;z-index:1;max-width:62%}
.banner h2{font-size:clamp(22px,4.4vw,34px);font-weight:800}
.banner p{margin:8px 0 0;font-size:14px;opacity:.95}
.banner svg{position:absolute;right:0;bottom:0;height:100%;width:50%;max-width:430px}
.bar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 12px}
.bar h2{font-size:24px;font-weight:800}
.bar button{border:0;background:none;color:var(--brand);font-weight:700;font-size:15px}
/* cartões */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}
@media (min-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.cover{display:block;width:100%;padding:0;border:0;background:var(--tint);aspect-ratio:16/10;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.cover:hover img{transform:scale(1.04)}
.pill{position:absolute;left:8px;top:8px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--orange);color:var(--orange-ink)}
.fav{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(10,20,40,.45);color:#fff;display:grid;place-items:center}
.fav[aria-pressed="true"]{background:#fff;color:#e0306a}
.who{display:flex;gap:10px;padding:0 10px;align-items:flex-start;min-width:0}
.txt{min-width:0;padding-top:8px}
.av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;margin-top:-22px;border:3px solid var(--surface);position:relative}
.av svg{width:22px;height:22px}
.who h3{font-size:16px;font-weight:700;line-height:1.15;min-width:0}
.who h3 button{all:unset;cursor:pointer;display:block}
.who h3 button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.rate{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);margin-top:3px}
.rate b{color:var(--ink)} .rate svg{width:14px;height:14px;color:var(--star)}
.foot{padding:8px 10px 12px;margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.foot .free{color:var(--ok);font-weight:700}
.foot .st{font-weight:700}.st.on{color:var(--ok)}.st.off{color:var(--bad)}
.mini{display:inline-flex;align-items:center;gap:6px;background:var(--wa);color:var(--wa-ink);border-radius:10px;padding:7px 11px;font-weight:700;font-size:13px;text-decoration:none}
.mini svg{width:16px;height:16px}
.empty{grid-column:1/-1;background:var(--surface);border:1.5px dashed var(--line);border-radius:18px;padding:30px;text-align:center;color:var(--muted)}
/* cadastre */
.cta{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:18px;background:var(--tint);padding:14px 18px;margin-top:26px}
.cta svg{flex:none;width:64px;height:64px}
.cta h3{font-size:22px;font-weight:800}
.cta p{margin:2px 0 0;color:var(--muted);font-size:14px}
.cta .chev{margin-left:auto;color:var(--brand);font-size:26px}
.form{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:12px;max-width:560px}
.form label{display:grid;gap:4px;font-weight:600;font-size:14px}
.form input,.form select{font:inherit;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.form button{border:0;border-radius:12px;background:var(--orange);color:var(--orange-ink);font-weight:800;padding:14px}
.ok{background:var(--tint);border-radius:12px;padding:12px 14px;font-weight:600}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.plan{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px}
.plan.hot{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange)}
.plan h3{font-size:20px}.plan ul{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:14px}.plan li+li{margin-top:4px}
.note{font-size:12px;color:var(--muted);margin:26px 0 0}
/* abas */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:var(--surface);border-top:1.5px solid var(--line);
  padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:600;color:var(--muted);padding:6px 0;position:relative}
.nav svg{width:26px;height:26px}
.nav button[aria-current="page"]{color:var(--brand)}
.nav button[aria-current="page"]::after{content:"";position:absolute;bottom:-2px;width:34px;height:3px;border-radius:3px;background:var(--brand)}
@media (min-width:900px){
  body{padding-block:0 40px}
  .nav{position:static;border:0;background:none;padding:0;justify-content:flex-start;gap:6px;margin:6px 0 2px}
  .nav button{flex:none;flex-direction:row;gap:8px;padding:10px 16px;border-radius:99px;font-size:15px}
  .nav svg{width:20px;height:20px}
  .nav button[aria-current="page"]{background:var(--tint)}
  .nav button[aria-current="page"]::after{display:none}
}
/* ficha */
.veil{position:fixed;inset:0;background:rgba(6,12,28,.62);display:flex;align-items:flex-end;justify-content:center;z-index:50}
[hidden]{display:none!important}
.sheet{background:var(--surface);width:100%;max-width:760px;max-height:94dvh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;position:relative}
@media (min-width:760px){.veil{align-items:center;padding:24px}.sheet{border-radius:22px;max-height:90dvh}}
.sheet-scroll{overflow:auto;overscroll-behavior:contain}
.close{position:absolute;right:12px;top:12px;z-index:3;width:42px;height:42px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);font-size:22px;line-height:1}
.gal{position:relative;background:var(--tint)}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.track img{flex:none;width:100%;aspect-ratio:16/10;object-fit:cover;scroll-snap-align:center;display:block}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);font-size:20px}
.arrow.p{left:10px}.arrow.n{right:10px}
.count{position:absolute;right:12px;bottom:12px;background:rgba(10,20,40,.74);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px}
.thumbs{display:flex;gap:6px;padding:10px 14px 0;overflow-x:auto}
.thumbs button{flex:none;width:62px;height:46px;border-radius:9px;overflow:hidden;border:2px solid transparent;padding:0;opacity:.65;background:none}
.thumbs button[aria-current="true"]{border-color:var(--brand);opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:16px 18px 20px;display:flex;flex-direction:column;gap:14px}
.info h2{font-size:28px;font-weight:800;letter-spacing:-.015em}
.meta{font-size:14px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:13px;background:var(--tint);padding:4px 10px;border-radius:99px;font-weight:600}
.row{display:grid;grid-template-columns:90px 1fr;gap:10px;font-size:15px}
.row b{color:var(--muted);font-weight:600}
.hours{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-variant-numeric:tabular-nums}
.contact{display:flex;gap:10px;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1.5px solid var(--line);background:var(--surface)}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 14px;border-radius:12px;font-weight:700;font-size:15px;text-decoration:none;border:1.5px solid var(--line);background:var(--surface)}
.btn.wa{background:var(--wa);color:var(--wa-ink);border-color:var(--wa)}
.btn svg{width:18px;height:18px}
.copy{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:2px 10px;font-size:13px;font-weight:600;margin-left:8px}
.sn{font-size:12px;color:var(--muted);padding:0 18px 12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.av{overflow:visible}.av img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover}

/* ===== Edição luxo: marinho e dourado ===== */
.bar button{white-space:nowrap}.bar h2{min-width:0}
body{background:radial-gradient(1200px 500px at 50% -120px,color-mix(in srgb,var(--gold) 14%,transparent),transparent 70%),var(--bg);background-attachment:fixed}
.wm{font-weight:700;font-size:32px;letter-spacing:.005em}.wm b{color:var(--brand);font-weight:700}.wm i{color:var(--gold);font-style:italic}
.logo svg rect:first-child{fill:var(--navy)}
.tag{letter-spacing:.14em;text-transform:uppercase;font-size:10px;color:var(--muted)}
h1,h2,h3{letter-spacing:0}.bar h2{font-size:30px;font-weight:700}.info h2{font-size:34px;font-weight:700}.cta h3{font-size:26px;font-weight:700}.plan h3{font-size:24px;font-weight:700}.who h3{font-size:19px;font-weight:700}
.bar h2::after{content:"";display:block;width:42px;height:2px;margin-top:6px;background:linear-gradient(90deg,var(--gold),transparent)}
.search{border-radius:99px;transition:border-color .25s,box-shadow .25s}.search:focus-within{border-color:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 22%,transparent),var(--shadow)}
.fbtn{border-radius:0 99px 99px 0}
.cat .tile{background:var(--surface)!important;color:var(--brand)!important;border:1.5px solid var(--line);box-shadow:var(--shadow);transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s}
.cat:hover .tile{transform:translateY(-4px);border-color:var(--gold)}
.cat[aria-pressed="true"] .tile{background:linear-gradient(145deg,var(--navy),#1a3a7a)!important;color:var(--gold2)!important;border-color:var(--gold)}
.cat[aria-pressed="true"]{color:var(--ink)}
.cat{font-size:13px;letter-spacing:.02em}
.chip{transition:background .25s,color .25s,transform .15s}.chip:active,button:active{transform:scale(.97)}
.chip svg{color:var(--gold)}.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--gold);color:var(--gold2)}.chip[aria-pressed="true"] svg{color:var(--gold2)}
.banner{border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);box-shadow:0 14px 34px rgba(10,23,54,.28);min-height:170px}
.banner::before{content:"";position:absolute;inset:0;background:radial-gradient(420px 220px at 85% 10%,rgba(201,162,77,.35),transparent 70%)}
.banner h2{font-weight:700;font-size:clamp(26px,5vw,40px);color:#fff}.banner p{color:var(--gold2)}
.banner div{transition:opacity .35s,transform .35s}.banner div.swap{opacity:0;transform:translateY(6px)}
.banner .par{will-change:transform;animation:floaty 9s ease-in-out infinite}
.dots{display:flex;gap:6px;margin-top:14px}.dots i{width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.35);transition:width .35s,background .35s}.dots i.on{width:22px;background:var(--gold)}
.card{border-radius:20px;border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s,border-color .3s;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.grid .card:nth-child(1){animation-delay:.02s}.grid .card:nth-child(2){animation-delay:.08s}.grid .card:nth-child(3){animation-delay:.14s}.grid .card:nth-child(4){animation-delay:.2s}.grid .card:nth-child(5){animation-delay:.26s}.grid .card:nth-child(6){animation-delay:.32s}.grid .card:nth-child(n+7){animation-delay:.38s}
@media (hover:hover){.card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(10,23,54,.18);border-color:color-mix(in srgb,var(--gold) 60%,var(--line))}}
.cover{position:relative}.cover::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(to top,rgba(5,11,27,.45),transparent);pointer-events:none}
.cover img{transition:transform .9s cubic-bezier(.2,.7,.2,1)}.card:hover .cover img{transform:scale(1.07)}
.pill{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2a1d04;letter-spacing:.08em;text-transform:uppercase;font-size:10px;padding:4px 10px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.prem{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 12px 32px rgba(201,162,77,.25)}
.prem::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.32) 50%,transparent 60%);transform:translateX(-130%);animation:sheen 7s ease-in-out 1.5s infinite;pointer-events:none}
.fav{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);background:rgba(10,23,54,.5);transition:transform .2s,background .25s}.fav:hover{transform:scale(1.1)}
.fav[aria-pressed="true"]{background:#fff}.fav.pop svg{animation:pop .5s cubic-bezier(.2,.9,.3,1.6)}
.av{border-color:var(--surface);box-shadow:0 0 0 1.5px var(--gold)}
.mini,.btn.wa{box-shadow:0 0 0 0 rgba(18,140,74,.5);animation:ring 3.2s ease-out infinite}
.mini{border-radius:99px}.btn{border-radius:99px}
.btn:not(.wa){border-color:var(--gold)}
.cta{background:linear-gradient(120deg,var(--navy),#16306b);color:#fff;border:1px solid var(--gold);box-shadow:0 14px 30px rgba(10,23,54,.25);transition:transform .35s cubic-bezier(.2,.8,.2,1)}.cta:hover{transform:translateY(-3px)}
.cta p{color:var(--gold2)}.cta .chev{color:var(--gold);transition:transform .3s}.cta:hover .chev{transform:translateX(6px)}
.form{border-radius:20px}.form button{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2a1d04;border-radius:99px;letter-spacing:.03em}
.plan{border-radius:20px}.plan.hot{border-color:var(--gold);box-shadow:0 0 0 1.5px var(--gold),0 12px 30px rgba(201,162,77,.2)}
.top{position:sticky;top:0;z-index:25;margin-inline:-16px;padding-inline:16px;background:color-mix(in srgb,var(--bg) 40%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
@media (max-width:899px){.nav{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid color-mix(in srgb,var(--gold) 45%,var(--line))}}
.nav button[aria-current="page"]{color:var(--ink)}.nav button[aria-current="page"]::after{background:var(--gold);width:28px}.nav button[aria-current="page"] svg{color:var(--gold)}
@media (min-width:900px){.nav button[aria-current="page"]{background:var(--navy);color:var(--gold2)}.nav button[aria-current="page"] svg{color:var(--gold2)}}
.veil{background:rgba(5,11,27,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .3s both}
.sheet{border:1px solid color-mix(in srgb,var(--gold) 50%,transparent);animation:sheetin .5s cubic-bezier(.2,.85,.25,1) both}
.track img{animation:fade .6s both}
.thumbs button[aria-current="true"]{border-color:var(--gold)}
.tags span{background:var(--tint);border:1px solid var(--line)}
.contact{background:color-mix(in srgb,var(--surface) 90%,transparent)}
.sk{animation:none}.sk .cover{background:linear-gradient(100deg,var(--tint) 30%,var(--surface) 50%,var(--tint) 70%);background-size:300% 100%;animation:shim 1.4s linear infinite}
.sk i{display:block;height:12px;border-radius:6px;margin-bottom:10px;width:80%;background:var(--tint)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}
@keyframes sheen{0%,55%{transform:translateX(-130%)}85%,100%{transform:translateX(130%)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(18,140,74,.45)}70%,100%{box-shadow:0 0 0 12px rgba(18,140,74,0)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheetin{from{opacity:0;transform:translateY(40px) scale(.97)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{translate:0 0}50%{translate:0 -6px}}
@keyframes shim{to{background-position:-300% 0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="logo">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="4" y="4" width="56" height="56" rx="16" fill="var(--brand)"/><path d="M18 26h28l-2.500 22a3 3 0 0 1-3 2.700H23.500a3 3 0 0 1-3-2.700z" fill="#fff"/><path d="M25 26v-3a7 7 0 0 1 14 0v3" fill="none" stroke="#fff" stroke-width="3.500" stroke-linecap="round"/><path d="M32 46s-6-5-6-9.500a6 6 0 0 1 12 0C38 41 32 46 32 46z" fill="#c9a24d"/><circle cx="32" cy="36.500" r="2.200" fill="#fff"/></svg>
      <div><div class="wm"><b>Ira</b> <i>Shopping</i></div><div class="tag">Tudo de Iracemápolis num lugar só</div></div>
    </div>
    <div class="loc"><button id="loc" aria-expanded="false" aria-controls="pop"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.500A2.500 2.500 0 1 1 12 6.500a2.500 2.500 0 0 1 0 5z"/></svg><span>Iracemápolis, SP</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="pop" id="pop" hidden><b>Iracemápolis, SP ✓</b><small>Outras cidades da região em breve.</small></div></div>
  </header>

  <form class="search" id="search" role="search">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <label class="sr" for="q">Buscar produtos, lojas e serviços</label>
    <input id="q" type="search" placeholder="Buscar produtos, lojas e serviços" autocomplete="off">
    <button class="fbtn" type="button" id="filt" aria-label="Filtros">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M6 14v6"/></svg></button>
  </form>

  <nav class="nav" id="nav" aria-label="Seções"></nav>

  <main id="view"></main>
  <p class="note" id="fonte"></p>
</div>

<div class="veil" id="veil" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="s-name"></div>
</div>


<script type="module">
import {carregarNegocios,registrarContato,urlFoto,urlLogo,enviarCadastro} from './ira-data.js';

const ICON={
 Comida:'<path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10"/><path d="M17 3c-2 2-2 6 0 8v10"/>',
 Mercado:'<path d="M3 4h3l2.500 11h9.500l2-8H7"/><circle cx="10" cy="19" r="1.500"/><circle cx="17" cy="19" r="1.500"/>',
 Bebidas:'<path d="M9 3h6M10 3v4l-2 3v10a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V10l-2-3V3"/><path d="M8 13h8"/>',
 Lojas:'<path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/>',
 Serviços:'<path d="M14 6a4 4 0 0 0 5 5l-9 9a2 2 0 0 1-3-3l9-9a4 4 0 0 0-2-2z"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 truck:'<path d="M2 6h11v10H2zM13 9h4l3 3v4h-7"/><circle cx="6" cy="18" r="1.800"/><circle cx="17" cy="18" r="1.800"/>',
 store:'<path d="M4 9l1.500-5h13L20 9M4 9h16v11H4zM4 9a3 3 0 0 0 5.300 2A3 3 0 0 0 15 11a3 3 0 0 0 5-2M10 20v-5h4v5"/>',
 home:'<path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
 heart:'<path d="M12 20s-7-4.500-7-10a4 4 0 0 1 7-2.500A4 4 0 0 1 19 10c0 5.500-7 10-7 10z"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
 star:'<path d="M12 3l2.600 5.600 6 .7-4.500 4.100 1.300 6L12 16.500 6.600 19.400l1.300-6L3.400 9.300l6-.7z" fill="currentColor" stroke="none"/>'};
const svg=(k,w)=>`<svg viewBox="0 0 24 24" ${w?`width="${w}" height="${w}"`:''} fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]||''}</svg>`;
const WA='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.600 15L2 22l5.200-1.400A10 10 0 1 0 12 2zm5.200 14c-.2.600-1.300 1.200-1.800 1.200-.5.100-1 .2-3.300-.7-2.800-1.100-4.600-4-4.700-4.200-.1-.2-1.100-1.500-1.100-2.800s.7-2 1-2.300c.2-.3.500-.3.700-.3h.5c.2 0 .4 0 .6.500l.8 2c.1.200.1.400 0 .6l-.4.600c-.2.200-.3.400-.1.700.2.300.8 1.300 1.800 2.100 1.200 1 2.200 1.300 2.500 1.500.3.100.5.100.7-.1l.9-1.100c.2-.3.400-.2.700-.1l1.900.9c.3.100.5.200.5.400.1.100.1.700-.1 1.300z"/></svg>';
const PHONE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.500 1.500a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>';
const HEART='<svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor" aria-hidden="true"><path d="M12 21s-8-5-8-11a4.500 4.500 0 0 1 8-2.800A4.500 4.500 0 0 1 20 10c0 6-8 11-8 11z"/></svg>';

let E=[];

const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const brl=n=>'R$ '+n.toFixed(2).replace('.',',');
const nota=n=>String(n).replace('.',',');
const DAY=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const fmtH=h=>{const m=Math.round((h%1)*60);return Math.floor(h)+(m?'h'+String(m).padStart(2,'0'):'h')};
const slot=(e,d)=>e.t24?[0,24]:(d===0?e.h.sun:d===6?e.h.sat:e.h.wk);
function status(e,now=new Date()){
  if(e.t24)return{on:1,txt:'Aberto 24 horas'};
  const d=now.getDay(),t=now.getHours()+now.getMinutes()/60,s=slot(e,d);
  if(s&&t>=s[0]&&t<s[1])return{on:1,txt:'Aberto · fecha às '+fmtH(s[1])};
  for(let k=0;k<8;k++){const dd=(d+k)%7,x=slot(e,dd);if(!x||(k===0&&t>=x[0]))continue;
    return{on:0,txt:'Fechado · abre '+(k===0?'hoje':k===1?'amanhã':DAY[dd])+' às '+fmtH(x[0])}}
  return{on:0,txt:'Fechado'};
}
const HUES={Comida:18,Mercado:140,Bebidas:205,Lojas:262,Serviços:42};
const pic=(e,i)=>urlFoto(e.id,i,e.ver);
const avatar=e=>`<span class="av" style="background:hsl(${HUES[e.cat]||210} 55% 40%)">${svg(e.cat)}<img alt="" src="${urlLogo(e.id,e.ver)}" onerror="this.remove()"></span>`;

let favs=new Set();try{favs=new Set(JSON.parse(localStorage.getItem('ira-favs')||'[]'))}catch{}
const saveFavs=()=>{try{localStorage.setItem('ira-favs',JSON.stringify([...favs]))}catch{}};
const st={view:'inicio',q:'',cat:'todas',sub:'',open:0,free:0,ret:0,sent:0};
const CATS=['Comida','Mercado','Bebidas','Lojas','Serviços'];
const rank={premium:0,destaque:1,gratis:2};

function list(){
  const q=norm(st.q.trim());
  return E.filter(e=>(st.cat==='todas'||e.cat===st.cat)&&(!st.sub||e.sub===st.sub)
    &&(!q||norm([e.name,e.cat,e.sub,e.desc,e.bairro,...e.tags].join(' ')).includes(q))
    &&(!st.open||status(e).on)&&(!st.free||e.f===0)&&(!st.ret||e.ret))
    .sort((a,b)=>rank[a.plan]-rank[b.plan]||a.i-b.i);
}
const waLink=e=>`https://wa.me/${e.wa}?text=${encodeURIComponent('Olá! Vi a '+e.name+' no Ira Shopping e gostaria de mais informações.')}`;
function card(e){
  const s=status(e);
  const foot=e.t?(e.f===0?`<span class="free">${svg('truck',16).replace('<svg','<svg style="vertical-align:-3px;margin-right:4px"')}Entrega grátis</span>`:`<span>${e.t} · Frete ${brl(e.f)}</span>`)
    :`<span>${e.orc?'Solicitar orçamento':`<span class="st ${s.on?'on':'off'}">${s.on?'Aberto agora':'Fechado agora'}</span>`}</span><a class="mini" data-track="whatsapp" data-id="${e.id}" target="_blank" rel="noopener noreferrer" href="${waLink(e)}">${WA}WhatsApp</a>`;
  return `<article class="card${e.plan==='premium'?' prem':''}"><button class="cover" data-open="${e.id}" aria-label="Abrir ${esc(e.name)}"><img loading="lazy" alt="" src="${pic(e,0)}"></button>
  ${e.plan==='premium'?'<span class="pill">Premium</span>':''}
  <button class="fav" data-fav="${e.id}" aria-pressed="${favs.has(e.id)}" aria-label="Salvar ${esc(e.name)}">${HEART}</button>
  <div class="who">${avatar(e)}<div class="txt"><h3><button data-open="${e.id}">${esc(e.name)}</button></h3><div class="rate">${svg('star')}<b>${nota(e.n[0])}</b> (${e.n[1]})</div></div></div>
  <div class="foot">${foot}</div></article>`;
}
const chips=()=>`<div class="chips" role="group" aria-label="Filtros rápidos">
  <button class="chip" data-f="open" aria-pressed="${!!st.open}">${svg('clock')}Aberto agora</button>
  <button class="chip" data-f="free" aria-pressed="${!!st.free}">${svg('truck')}Entrega grátis</button>
  <button class="chip" data-f="ret" aria-pressed="${!!st.ret}">${svg('store')}Retirada</button></div>`;
const cats=()=>`<div class="cats">${CATS.map(c=>`<button class="cat" data-cat="${c}" aria-pressed="${st.cat===c}"><span class="tile">${svg(c)}</span>${c}</button>`).join('')}</div>`;
const subs=()=>{if(st.cat==='todas')return'';const s=[...new Set(E.filter(e=>e.cat===st.cat).map(e=>e.sub))];
  return `<div class="subs" role="group" aria-label="Subcategorias"><button class="chip" data-sub="" aria-pressed="${!st.sub}">Todas</button>${s.map(x=>`<button class="chip" data-sub="${esc(x)}" aria-pressed="${st.sub===x}">${esc(x)}</button>`).join('')}</div>`};
const BANNER=`<div class="banner"><div><h2 data-bt="h">O comércio de Ira na sua mão</h2><p data-bt="p">Encontre empresas perto de você</p><span class="dots" aria-hidden="true"><i class="on"></i><i></i><i></i></span></div>
 <svg class="par" viewBox="0 0 300 150" preserveAspectRatio="xMaxYMax slice" aria-hidden="true"><path d="M70 150C80 80 150 40 300 60V150z" fill="#fff" opacity=".14"/><rect x="170" y="62" width="40" height="88" fill="#fff" opacity=".95"/><path d="M164 64l26-30 26 30z" fill="#fff"/><rect x="186" y="12" width="8" height="26" fill="#fff"/><rect x="178" y="18" width="24" height="7" fill="#fff"/><circle cx="190" cy="82" r="9" fill="#c9a24d"/><path d="M190 76v6l4 2" stroke="#fff" stroke-width="2" fill="none"/><rect x="180" y="106" width="20" height="44" rx="10" fill="#c9a24d" opacity=".85"/><path d="M250 150v-52M250 98c-18-4-30 6-34 14M250 98c18-4 30 6 34 14M250 98c-6-14-18-18-28-14M250 98c6-14 18-18 28-14" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".9"/><path d="M118 150v-40M118 110c-12-2-20 4-24 10M118 110c12-2 20 4 24 10" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".7"/></svg></div>`;
const CTA=`<button class="cta" data-go="perfil"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="26" width="48" height="32" rx="3" fill="#fff"/><path d="M6 26l5-14h42l5 14z" fill="#c9a24d"/><path d="M14 12v14M24 12v14M34 12v14M44 12v14" stroke="#fff" stroke-width="3"/><rect x="14" y="34" width="12" height="12" rx="1.500" fill="#12285a"/><rect x="38" y="34" width="12" height="12" rx="1.500" fill="#12285a"/><rect x="28" y="38" width="9" height="20" fill="#12285a"/></svg><div><h3>Cadastre sua empresa</h3><p>Sua loja ou serviço também pode estar aqui</p></div><span class="chev" aria-hidden="true">›</span></button>`;
const DEMO='<p class="note">Protótipo de demonstração. Empresas, notas, telefones, endereços e fotos são exemplos inventados e não representam comércios reais de Iracemápolis-SP.</p>';

const VIEWS={
 inicio(){const r=list(),top=st.cat==='todas'&&!st.q&&!st.sub&&!st.open&&!st.free&&!st.ret?r.slice(0,8):r;
   return cats()+subs()+chips()+(st.cat==='todas'?BANNER:'')+`<div class="bar"><h2>${st.cat==='todas'?'Destaques em Iracemápolis':esc(st.cat)}</h2><button data-go="buscar">Ver todos ›</button></div>
   <section class="grid">${top.length?top.map(card).join(''):'<div class="empty"><b>Nada encontrado.</b><br>Tire algum filtro ou escolha outra categoria.</div>'}</section>`+CTA+DEMO},
 buscar(){const r=list();
   return cats()+subs()+chips()+`<div class="bar"><h2>${st.q?`Resultados para “${esc(st.q.trim())}”`:'Todas as empresas'}</h2><small style="color:var(--muted)">${r.length} ${r.length===1?'empresa':'empresas'}</small></div>
   <section class="grid">${r.length?r.map(card).join(''):'<div class="empty"><b>Nada encontrado.</b><br>Tente outra palavra, tire algum filtro ou escolha outra categoria.</div>'}</section>`+DEMO},
 favoritos(){const r=E.filter(e=>favs.has(e.id));
   return `<div class="bar"><h2>Favoritos</h2></div><section class="grid">${r.length?r.map(card).join(''):'<div class="empty"><b>Você ainda não salvou nenhuma empresa.</b><br>Toque no coração de um cartão para guardar aqui.</div>'}</section>`},
 perfil(){return `<div class="bar"><h2>Cadastre sua empresa</h2></div>
  ${st.err?'<div class="ok" role="alert" style="background:var(--c1)">Não foi possível enviar agora. Tente de novo em instantes.</div>':''}${st.sent?'<div class="ok" role="status">Recebemos o seu cadastro! Nossa equipe confirma o seu WhatsApp e publica o perfil em até 1 dia útil.</div>':
  `<form class="form" id="reg"><label for="r-n">Nome da empresa<input id="r-n" required placeholder="Ex.: Padaria Pão de Praça"></label>
   <label for="r-c">Categoria<select id="r-c">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></label>
   <label for="r-w">WhatsApp<input id="r-w" required inputmode="tel" placeholder="(19) 9 0000-0000"></label>
   <button type="submit">Enviar cadastro</button></form>`}
  <div class="bar"><h2>Planos</h2></div><section class="plans">
  <div class="plan"><h3>Gratuito</h3><ul><li>Nome, categoria e endereço</li><li>Telefone e horário</li><li>Até 3 fotos</li></ul></div>
  <div class="plan hot"><h3>Destaque</h3><ul><li>Galeria com 10 fotos</li><li>WhatsApp com mensagem pronta</li><li>Selo de verificado e “Como chegar”</li></ul></div>
  <div class="plan"><h3>Premium</h3><ul><li>Topo da categoria e da home</li><li>Página com vídeo</li><li>Relatório mensal de contatos</li></ul></div></section>`+DEMO}
};
const TABS=[['inicio','Início','home'],['buscar','Buscar','search'],['favoritos','Favoritos','heart'],['perfil','Perfil','user']];
function render(){
  $('#nav').innerHTML=TABS.map(([k,l,i])=>`<button data-go="${k}" ${st.view===k?'aria-current="page"':''}>${svg(i)}${l}</button>`).join('');
  $('#view').innerHTML=VIEWS[st.view]();
}
function go(v,keepScroll){st.view=v;render();if(!keepScroll)scrollTo({top:0});if(location.hash!=='#'+v&&!$('#veil').offsetParent)location.hash=v}

/* ficha da empresa */
let cur=null,idx=0,lastFocus=null;
function openCo(id,push=true){
  const e=E.find(x=>x.id===id);if(!e)return;cur=e;idx=0;lastFocus=document.activeElement;
  const s=status(e);
  const rows=e.t24?'<span>Todos os dias</span><span>24 horas</span>':[['Segunda a sexta',e.h.wk],['Sábado',e.h.sat],['Domingo',e.h.sun]].map(([l,h])=>`<span>${l}</span><span>${h?fmtH(h[0])+' às '+fmtH(h[1]):'Fechado'}</span>`).join('');
  const deliv=e.t?(e.f===0?'Entrega grátis · '+e.t:e.t+' · Frete '+brl(e.f)):'';
  $('#sheet').innerHTML=`<div class="sheet-scroll"><button class="close" id="x" aria-label="Fechar">×</button>
  <div class="gal"><div class="track" id="track">${Array.from({length:e.photos},(_,i)=>`<img alt="${esc(e.name)}, foto ${i+1}" src="${pic(e,i)}">`).join('')}</div>
  ${e.photos>1?'<button class="arrow p" id="pv" aria-label="Foto anterior">‹</button><button class="arrow n" id="nx" aria-label="Próxima foto">›</button>':''}<span class="count" id="cnt"></span></div>
  <div class="thumbs" id="thumbs">${Array.from({length:e.photos},(_,i)=>`<button data-i="${i}" aria-label="Foto ${i+1}"><img alt="" src="${pic(e,i)}"></button>`).join('')}</div>
  <div class="info"><div><h2 id="s-name">${esc(e.name)}</h2>
  <div class="meta" style="margin-top:6px"><span style="color:var(--star)">★</span> <b style="color:var(--ink)">${nota(e.n[0])}</b> (${e.n[1]} avaliações) · ${esc(e.cat)} · ${esc(e.sub)}</div></div>
  <div class="foot" style="padding:0;gap:12px"><span class="st ${s.on?'on':'off'}">${esc(s.txt)}</span>${deliv?`<span>${esc(deliv)}</span>`:''}${e.ret?'<span>Retirada no local</span>':''}</div>
  <p style="margin:0">${esc(e.desc)}</p><div class="tags">${e.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div>
  <div style="display:grid;gap:10px"><div class="row"><b>Endereço</b><span>${esc(e.end)}${e.end!=='—'?'<br>'+esc(e.bairro)+', Iracemápolis-SP':'<br>'+esc(e.bairro)}</span></div>
  <div class="row"><b>Telefone</b><span><span id="ph">${esc(e.phone)}</span><button class="copy" id="cp">Copiar</button></span></div>
  <div class="row"><b>Horários</b><span class="hours">${rows}</span></div></div></div>
  <p class="sn">${e.plan==='gratis'?'Perfil básico (plano Gratuito): até 3 fotos. ':''}Protótipo: telefone, nota e endereço fictícios.</p></div>
  <div class="contact"><a class="btn wa" data-track="whatsapp" data-id="${e.id}" target="_blank" rel="noopener noreferrer" href="${waLink(e)}">${WA}${e.orc?'Orçamento':'WhatsApp'}</a><a class="btn" data-track="ligar" data-id="${e.id}" href="tel:${e.phone.replace(/\D/g,'')}">${PHONE}Ligar</a></div>`;
  $('#veil').hidden=false;document.body.style.overflow='hidden';
  const tr=$('#track');tr.addEventListener('scroll',()=>{const i=Math.round(tr.scrollLeft/tr.clientWidth);if(i!==idx){idx=i;mark()}},{passive:true});
  mark();$('#x').focus();
  if(push&&location.hash!=='#e-'+id)location.hash='e-'+id;
}
function mark(){$('#cnt').textContent=(idx+1)+' / '+cur.photos;
  document.querySelectorAll('#thumbs button').forEach((b,i)=>{b.setAttribute('aria-current',i===idx);if(i===idx)b.scrollIntoView({inline:'center',block:'nearest'})})}
function slide(i){const tr=$('#track');idx=(i+cur.photos)%cur.photos;tr.scrollTo({left:idx*tr.clientWidth,behavior:'smooth'});mark()}
function closeCo(push=true){if($('#veil').hidden)return;$('#veil').hidden=true;document.body.style.overflow='';cur=null;
  if(push&&location.hash.startsWith('#e-'))location.hash=st.view;lastFocus&&lastFocus.focus&&lastFocus.focus()}

document.addEventListener('click',ev=>{
  const t=ev.target;let b;
  if(b=t.closest('[data-track]'))registrarContato(b.dataset.id,b.dataset.track);
  if(b=t.closest('[data-open]'))return openCo(b.dataset.open);
  if(b=t.closest('[data-fav]')){const id=b.dataset.fav;favs.has(id)?favs.delete(id):favs.add(id);saveFavs();render();const nb=document.querySelector('[data-fav="'+id+'"]');if(nb&&favs.has(id)){nb.classList.add('pop');}return}
  if(b=t.closest('[data-cat]')){st.cat=st.cat===b.dataset.cat?'todas':b.dataset.cat;st.sub='';return render()}
  if(b=t.closest('[data-sub]')){st.sub=b.dataset.sub;return render()}
  if(b=t.closest('[data-f]')){st[b.dataset.f]=st[b.dataset.f]?0:1;return render()}
  if(b=t.closest('[data-go]'))return go(b.dataset.go);
  if(t.closest('#filt'))return go('buscar');
  if(t.closest('#loc')){const p=$('#pop');p.hidden=!p.hidden;$('#loc').setAttribute('aria-expanded',!p.hidden);return}
  if(!t.closest('.loc'))$('#pop').hidden=true;
  if(b=t.closest('#thumbs [data-i]'))return slide(+b.dataset.i);
  if(t.closest('#pv'))return slide(idx-1);
  if(t.closest('#nx'))return slide(idx+1);
  if(t.closest('#x')||t===$('#veil'))return closeCo();
  if(t.closest('#cp')){const n=cur.phone,done=()=>{$('#cp').textContent='Copiado'};
    (navigator.clipboard?navigator.clipboard.writeText(n):Promise.reject()).then(done).catch(()=>{const r=document.createRange();r.selectNodeContents($('#ph'));const s=getSelection();s.removeAllRanges();s.addRange(r);$('#cp').textContent='Selecionado'})}
});
document.addEventListener('submit',async ev=>{if(ev.target.id==='reg'){ev.preventDefault();const btn=ev.target.querySelector('button');btn.disabled=true;
  try{await enviarCadastro({nome:$('#r-n').value,categoria:$('#r-c').value,whatsapp:$('#r-w').value});st.sent=1;st.err=0}catch{st.err=1}render()}});
document.addEventListener('keydown',ev=>{if($('#veil').hidden)return;
  if(ev.key==='Escape')closeCo();else if(ev.key==='ArrowRight')slide(idx+1);else if(ev.key==='ArrowLeft')slide(idx-1);
  else if(ev.key==='Tab'){const f=[...$('#sheet').querySelectorAll('button,a[href]')];if(!f.length)return;const a=f[0],z=f[f.length-1];
    if(ev.shiftKey&&document.activeElement===a){ev.preventDefault();z.focus()}else if(!ev.shiftKey&&document.activeElement===z){ev.preventDefault();a.focus()}}});
$('#search').addEventListener('submit',e=>{e.preventDefault()});
$('#q').addEventListener('input',e=>{st.q=e.target.value;if(st.view!=='buscar'&&st.q)go('buscar',true);else render()});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);
  if(h.startsWith('e-'))openCo(h.slice(2),false);else{closeCo(false);if(VIEWS[h]&&h!==st.view){st.view=h;render()}}});
const SK='<section class="grid">'+'<div class="card sk"><div class="cover"></div><div style="padding:14px"><i></i><i style="width:55%"></i></div></div>'.repeat(6)+'</section>';
const REDUZ=matchMedia('(prefers-reduced-motion:reduce)').matches;
const MSGS=[['O comércio de Ira na sua mão','Encontre empresas perto de você'],['Fale direto com quem atende','WhatsApp ou ligação, sem intermediários'],['Sua empresa em destaque','Cadastre-se e apareça para a cidade inteira']];
let mi=0;
if(!REDUZ){setInterval(()=>{const h=document.querySelector('[data-bt=h]'),p=document.querySelector('[data-bt=p]');if(!h||document.hidden)return;
  const w=h.parentElement;w.classList.add('swap');setTimeout(()=>{mi=(mi+1)%MSGS.length;h.textContent=MSGS[mi][0];p.textContent=MSGS[mi][1];
  w.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('on',i===mi));w.classList.remove('swap')},350)},6000);
  let tick=0;addEventListener('scroll',()=>{if(tick)return;tick=requestAnimationFrame(()=>{tick=0;const sv=document.querySelector('.banner .par');if(sv)sv.style.transform='translateY('+Math.min(scrollY*.08,18)+'px)'})},{passive:true})}
(async()=>{
  $('#view').innerHTML=SK;
  const {lista,fonte}=await carregarNegocios();E=lista;
  const f=$('#fonte');if(f)f.textContent='Fonte dos dados: '+fonte+' · '+E.length+' empresas';
  const h=location.hash.slice(1);if(VIEWS[h])st.view=h;render();if(h.startsWith('e-'))openCo(h.slice(2),false);
})();

</script>
</body>
</html>
